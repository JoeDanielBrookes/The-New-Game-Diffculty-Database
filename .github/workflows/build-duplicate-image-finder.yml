name: Build Duplicate Image Finder (Windows)

# Builds DuplicateImageFinder.exe on a Windows machine whenever the app
# changes (or when started by hand from the Actions tab), checks that it
# runs, and publishes it on the repository's Releases page.
on:
  push:
    paths:
      - "duplicate_image_finder/**"
      - ".github/workflows/build-duplicate-image-finder.yml"
  workflow_dispatch:

permissions:
  contents: write  # Needed to publish the release.

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: duplicate_image_finder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run the tests on Windows
        run: python -m unittest discover -s tests -v

      - name: Build the .exe
        run: python build_exe.py

      - name: Check the .exe starts and its features load
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $p = Start-Process -FilePath "dist\DuplicateImageFinder.exe" `
                 -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: DuplicateImageFinder-windows
          path: duplicate_image_finder/dist/DuplicateImageFinder.exe

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "duplicate-image-finder-build-${{ github.run_number }}"
          $notes = "Standalone Windows build of Duplicate Image Finder (no Python needed).`n`n" +
                   "Download DuplicateImageFinder.exe and double-click it. Windows may show " +
                   "'Windows protected your PC' because the program isn't code-signed: " +
                   "click More info, then Run anyway.`n`nBuilt from ${{ github.ref_name }} at ${{ github.sha }}."
          gh release create $tag "dist\DuplicateImageFinder.exe" `
            --target "${{ github.sha }}" `
            --title "Duplicate Image Finder for Windows (build ${{ github.run_number }})" `
            --notes $notes
